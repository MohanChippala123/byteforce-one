<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Unlock - Byteforce One</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .lock {
      width: 280px;
      margin: auto 0;
      padding: 24px 0;
      text-align: center;
    }

    .brand {
      margin: 0 0 2px;
      color: #777777;
      font-size: 13px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 18px;
      font-weight: 600;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      height: 18px;
      margin-bottom: 40px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border: 2px solid #111111;
      border-radius: 50%;
      background: #ffffff;
    }

    .dot.on {
      background: #111111;
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      justify-items: center;
    }

    .pad button {
      width: 64px;
      height: 64px;
      padding: 0;
      border: 1px solid #e5e5e5;
      border-radius: 50%;
      background: #ffffff;
      color: #111111;
      font: inherit;
      font-size: 22px;
      cursor: pointer;
    }

    .pad button:hover {
      background: #f6f6f6;
    }

    .pad button:active {
      background: #eeeeee;
    }

    .pad .blank {
      border: 0;
      background: none;
      cursor: default;
    }

    .pad .del {
      border: 0;
      color: #555555;
      font-size: 14px;
    }

    .pad .del:hover {
      background: none;
      color: #111111;
      text-decoration: underline;
    }

    .msg {
      min-height: 20px;
      margin: 22px 0 0;
      color: #a33333;
      font-size: 13px;
    }

    .shake {
      animation: shake 0.25s linear;
    }

    @keyframes shake {
      25% {
        transform: translateX(-6px);
      }
      75% {
        transform: translateX(6px);
      }
    }

    @media (max-height: 560px) {
      .lock {
        padding: 0;
      }

      h1 {
        margin-bottom: 16px;
      }

      .dots {
        margin-bottom: 20px;
      }

      .pad button {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>

  <main class="lock" id="lock">
    <p class="brand">Byteforce One</p>
    <h1>Enter passcode</h1>

    <div class="dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="pad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" class="blank" tabindex="-1" aria-hidden="true"></button>
      <button type="button" data-key="0">0</button>
      <button type="button" class="del" data-del aria-label="Delete">Delete</button>
    </div>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      var code = "";
      var busy = false;
      var dots = Array.prototype.slice.call(document.querySelectorAll(".dot"));
      var msg = document.getElementById("msg");
      var lock = document.getElementById("lock");

      function draw() {
        dots.forEach(function (dot, index) {
          dot.classList.toggle("on", index < code.length);
        });
      }

      function fail() {
        code = "";
        draw();
        msg.textContent = "Wrong passcode";
        lock.classList.remove("shake");
        void lock.offsetWidth;
        lock.classList.add("shake");
      }

      function press(key) {
        if (busy || code.length === 6) return;
        msg.textContent = "";
        code += key;
        draw();
        if (code.length === 6) submit();
      }

      function target() {
        var next = new URLSearchParams(location.search).get("next") || "/";
        if (next.charAt(0) !== "/" || next.charAt(1) === "/" || next.indexOf("\\") !== -1) return "/";
        return next;
      }

      function submit() {
        busy = true;
        fetch("/api/unlock", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ code: code })
        }).then(function (response) {
          if (response.ok) {
            try {
              sessionStorage.setItem("bf_nav", "1");
            } catch (error) {
              /* storage unavailable */
            }
            location.replace(target());
            return;
          }
          busy = false;
          if (response.status === 401) {
            fail();
            return;
          }
          if (response.status === 429) {
            code = "";
            draw();
            msg.textContent = "Too many attempts. Try again later.";
            return;
          }
          fail();
        }).catch(function () {
          busy = false;
          fail();
        });
      }

      Array.prototype.forEach.call(document.querySelectorAll("[data-key]"), function (button) {
        button.addEventListener("click", function () {
          press(button.getAttribute("data-key"));
        });
      });

      document.querySelector("[data-del]").addEventListener("click", function () {
        if (busy) return;
        code = code.slice(0, -1);
        msg.textContent = "";
        draw();
      });

      window.addEventListener("keydown", function (event) {
        if (/^[0-9]$/.test(event.key)) {
          press(event.key);
        } else if (event.key === "Backspace") {
          code = code.slice(0, -1);
          draw();
        }
      });

      draw();
    })();
  </script>

</body>
</html>
